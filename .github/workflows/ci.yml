name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore backend
        run: dotnet restore MtgSoloSports.slnx --locked-mode
      - name: Build backend
        run: dotnet build MtgSoloSports.slnx --configuration Release --no-restore
      - name: Test backend
        run: dotnet test MtgSoloSports.slnx --configuration Release --no-build --no-restore --logger "trx;LogFileName=test-results.trx"
      - name: Slow-test summary
        # MSS-122: ranked slow-test report from TRX metadata; runs even on test
        # failure but never turns a failed test job green (no continue-on-error).
        if: always()
        run: |
          python3 scripts/test-timing.py --self-check
          TRX_FILE=$(ls tests/MtgSoloSports.Tests/TestResults/*.trx 2>/dev/null | head -n 1)
          if [ -z "$TRX_FILE" ]; then
            echo "No TRX results found; skipping timing summary." | tee timing-summary.txt
          else
            python3 scripts/test-timing.py "$TRX_FILE" --top 20 | tee timing-summary.txt
          fi
          {
            echo "## Slow-test summary (MSS-122)"
            echo '```'
            cat timing-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload test timing artifacts
        # MSS-122: bounded TRX plus compact summary, including on failure.
        # Only timing files are uploaded: no save databases or catalog dumps.
        # Diagnostic upload must never fail the job or skip the frontend gates.
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: |
            tests/MtgSoloSports.Tests/TestResults/*.trx
            timing-summary.txt
          retention-days: 7
          if-no-files-found: warn
      - name: Verify formatting
        run: dotnet format MtgSoloSports.slnx --verify-no-changes --no-restore
      - name: Install frontend dependencies
        run: npm ci --prefix src/MtgSoloSports.Web
      - name: Test frontend
        # MSS-068: run the mounted Standings/History hook-order regression
        # tests (and all other frontend tests) in PR CI so React #310
        # cannot recur without failing the required build-and-test check.
        run: npm run test --prefix src/MtgSoloSports.Web
      - name: Typecheck frontend
        run: npm run typecheck --prefix src/MtgSoloSports.Web
      - name: Build frontend
        run: npm run build --prefix src/MtgSoloSports.Web
      - name: Check exact-case paths and imports
        # MSS-043: fails on case-only tracked-path collisions, wrongly cased
        # frontend imports and missing Dockerfile/Compose sources, so Linux
        # CI catches what a case-insensitive Windows checkout would hide.
        run: python3 scripts/check-casing.py

  docker-smoke:
    # MSS-043: validates the documented one-command local run on Linux:
    # Compose syntax, production image build, API + SPA fallback smoke and
    # named-volume persistence across down/rebuild. Existing backend and
    # frontend gates above stay untouched.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate Compose syntax
        run: docker compose config -q
      - name: Build production image
        run: docker compose build
      - name: Start application
        run: docker compose up -d
      - name: Smoke test API and SPA fallback
        run: sh scripts/docker-smoke.sh http://localhost:8080 180
      - name: Verify volume persistence across restart
        # No catalog import or save creation is needed: a marker written
        # through the running (non-root) container must survive
        # `docker compose down` (volumes kept) plus an image rebuild.
        run: |
          docker compose exec -T app sh -c 'echo "persist-probe" > /data/.persist-probe && cat /data/.persist-probe'
          docker compose down
          docker compose up -d --build
          sh scripts/docker-smoke.sh http://localhost:8080 180
          docker compose exec -T app cat /data/.persist-probe
      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color app
      - name: Tear down
        if: always()
        run: docker compose down
