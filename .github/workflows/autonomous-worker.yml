name: autonomous-worker
run-name: autonomy ${{ inputs.task_id }} ${{ inputs.attempt_id || 'manual' }}
on:
  workflow_dispatch:
    inputs:
      task_id:
        description: Control task ID
        required: true
        type: string
      task_path:
        description: Authoritative control task path
        required: true
        type: string
      control_repo:
        description: Approved control repository
        default: AlexBDevCorner/AutonomousWork
        required: true
        type: string
      control_commit:
        description: Full control SHA; empty only for manual dispatch
        default: ''
        type: string
      model:
        description: OpenCode Go model
        default: opencode-go/muse-spark-1.3-contributor
        type: string
      variant:
        description: OpenCode model reasoning variant
        default: xhigh
        type: string
      attempt_id:
        description: Persisted attempt UUID; empty for manual dispatch
        default: ''
        type: string
      mode:
        description: Implementation or bounded review correction
        type: choice
        options: [implementation, correction]
        default: implementation
      review_id:
        description: Trusted blocking review ID for correction
        default: ''
        type: string
      expected_head:
        description: Reviewed PR head SHA for correction
        default: ''
        type: string
concurrency:
  group: autonomous-worker
  cancel-in-progress: false
permissions:
  contents: read
  pull-requests: write
  issues: write
  actions: read
  checks: read
jobs:
  worker:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 270
    env:
      GH_REPO: ${{ github.repository }}
      TASK_ID: ${{ inputs.task_id }}
      TASK_PATH: ${{ inputs.task_path }}
      ATTEMPT_ID: ${{ inputs.attempt_id }}
      WORK_MODE: ${{ inputs.mode }}
      REVIEW_ID: ${{ inputs.review_id }}
      EXPECTED_HEAD: ${{ inputs.expected_head }}
    steps:
      - name: Validate dispatch inputs before checkout
        shell: bash
        env:
          CONTROL_REPO: ${{ inputs.control_repo }}
          CONTROL_COMMIT: ${{ inputs.control_commit }}
        run: |
          set -euo pipefail
          if [[ "${CONTROL_REPO:-}" != 'AlexBDevCorner/AutonomousWork' ]]; then echo 'Unapproved control repository' >&2; exit 1; fi
          if [[ ! "${TASK_ID:-}" =~ ^MSS-[0-9]+$ ]]; then echo 'Invalid task ID' >&2; exit 1; fi
          if [[ "${TASK_PATH:-}" != "projects/mtgsolosports/tasks/${TASK_ID}.md" ]]; then echo 'Invalid task path' >&2; exit 1; fi
          if [[ -n "${CONTROL_COMMIT:-}" && ! "${CONTROL_COMMIT}" =~ ^[a-f0-9]{40}$ ]]; then echo 'Expected full control SHA' >&2; exit 1; fi
          if [[ -n "${ATTEMPT_ID:-}" && ( ! "${ATTEMPT_ID}" =~ ^[a-f0-9-]{36}$ || -z "${CONTROL_COMMIT:-}" ) ]]; then echo 'Invalid claim' >&2; exit 1; fi
          if [[ "${WORK_MODE:-}" != 'implementation' && "${WORK_MODE:-}" != 'correction' ]]; then echo 'Invalid mode' >&2; exit 1; fi
          if [[ -n "${EXPECTED_HEAD:-}" && ! "${EXPECTED_HEAD:-}" =~ ^[a-f0-9]{40}$ ]]; then echo 'Invalid expected head' >&2; exit 1; fi
          if [[ "${WORK_MODE:-}" == 'correction' && ( -z "${ATTEMPT_ID:-}" || ! "${REVIEW_ID:-}" =~ ^[0-9]+$ || -z "${EXPECTED_HEAD:-}" ) ]]; then echo 'Invalid review claim' >&2; exit 1; fi
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: AlexBDevCorner/AutonomousWork
          ref: ${{ inputs.control_commit || 'master' }}
          token: ${{ secrets.CONTROL_REPO_TOKEN }}
          path: control
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build validator and record pin
        shell: bash
        run: |
          set -euo pipefail
          dotnet build control/tools/AutonomousWork.Cli -c Release --nologo
          controlSha="$(git -C control rev-parse HEAD)"
          echo "CONTROL_SHA=${controlSha}" >> "${GITHUB_ENV}"
      - name: Verify authorization and bounded execution
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONTROL_READ_TOKEN: ${{ secrets.CONTROL_REPO_TOKEN }}
        run: node control/tools/autonomy/worker.mjs guard
      - name: Prepare local task branch
        shell: bash
        run: |
          set -euo pipefail
          branch="autonomous/${TASK_ID}"
          git config user.name autonomous
          git config user.email autonomous@local
          if git ls-remote --exit-code --heads origin "${branch}" >/dev/null 2>&1; then
            git fetch origin "${branch}"
            git switch -C "${branch}" "origin/${branch}"
          else
            git switch -c "${branch}"
          fi

          # Keep the model session local. A fresh installation token is minted
          # after it exits and owns all remote publication.
          git remote set-url --push origin "https://github.invalid/${GH_REPO}.git"
      - name: Run OpenCode worker
        id: opencode-worker
        timeout-minutes: 240
        uses: anomalyco/opencode/github@83abc64a5c4e0e0a5157f2c4435d34131009a404 # pinned 2026-09-19
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENCODE_CONFIG_CONTENT: '{"permission":{"external_directory":{"*":"deny","**/Temp/**":"allow","**/_temp/**":"allow","**/tmp/**":"allow"},"edit":{"**/Temp/**":"deny","**/_temp/**":"deny","**/tmp/**":"deny"},"bash":{"*":"allow","*GITHUB_ENV*":"deny","*GITHUB_PATH*":"deny","*GITHUB_OUTPUT*":"deny","*GITHUB_STATE*":"deny","*GH_TOKEN*":"deny","*GITHUB_TOKEN*":"deny","*gh auth token*":"deny","*extraheader*":"deny","*AUTHORIZATION*":"deny"},"doom_loop":"deny","question":"deny"}}'
        with:
          model: ${{ inputs.model }}
          variant: ${{ inputs.variant }}
          share: false
          use_github_token: true
          prompt: |
            Implement only task ${{ inputs.task_id }}. Follow AGENTS.md.
            Read the authoritative specification at control/${{ inputs.task_path }}.
            The control checkout is read-only. Never change it, requirements, priorities, or future tasks.
            Do not access GITHUB_EVENT_PATH or other files outside the repository and control checkout.
            The workflow has already checked out autonomous/${{ inputs.task_id }} for you.
            Work locally: commit meaningful checkpoints, but DO NOT push, create/reopen/ready a PR, or change remote refs.
            Remote git push is intentionally disabled during the model session. A post-worker recovery step uses a freshly minted GitHub App token to preserve your commits and manage the PR.
            You may use gh for read-only inspection. In correction mode only, you may post the required machine-readable disagreement comment if you genuinely disagree with the blocking review.
            Never inspect, extract, decode, print, or persist GitHub credentials. Never run `gh auth token`.
            If authentication fails, stop rather than attempting credential recovery.
            Execution mode: ${{ inputs.mode }}.
            Expected existing PR head: ${{ inputs.expected_head }}.
            If mode is implementation and expected_head is non-empty, perform only the bounded CI repair for the existing task PR.
            For normal implementation continue on the already checked-out autonomous/${{ inputs.task_id }} branch and reuse its existing work on retry.
            Preserve progress with meaningful local checkpoint commits during long work.
            Do not push or create/update PR state yourself; the workflow recovery step owns those remote mutations.
            A successful run must leave locally committed, verified changes ready for the recovery step to publish.
            For correction, evaluate the trusted blocking review and fix valid blocking findings only. If you genuinely disagree technically, leave the reviewed head unchanged and post the machine-readable disagreement comment required by the AutonomousWork protocol.
            Required repository verification is defined by AGENTS.md and the task. Record real commands/results; never invent evidence.
            Keep the vertical-slice architecture. Do not add MediatR, generic repositories, horizontal Domain/Application/Infrastructure projects, message buses or unrelated architectural frameworks.
            Open/update the same PR to main titled [${{ inputs.task_id }}] <description>.
            Never merge, force-push, or commit secrets.
            You are running on Ubuntu. Use bash/POSIX syntax.


      - name: Mint recovery GitHub App token
        if: always() && steps.opencode-worker.outcome != 'skipped'
        id: recovery-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.AUTONOMOUS_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTONOMOUS_APP_PRIVATE_KEY }}
          owner: AlexBDevCorner
          repositories: MtgSoloSports
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
          permission-workflows: write
          permission-actions: read
          permission-checks: read
      - name: Preserve worker progress and ensure pull request
        if: always() && steps.opencode-worker.outcome != 'skipped' && steps.recovery-token.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.recovery-token.outputs.token }}
          BASE_BRANCH: main
          WORKER_OUTCOME: ${{ steps.opencode-worker.outcome }}
        run: |
          set -euo pipefail
          git remote set-url --push origin "https://github.com/${GH_REPO}.git"
          gh auth setup-git --hostname github.com --force

          preferred="autonomous/${TASK_ID}"
          current="$(git branch --show-current)"
          if [[ "${current}" != "${preferred}" ]]; then
            echo "Worker ended on unexpected branch ${current}; publishing HEAD only to canonical ${preferred}." >&2
          fi

          dirty="$(git status --porcelain | grep -v '^?? control/' || true)"
          recovery_commit=false
          if [[ -n "${dirty}" ]]; then
            git add -A -- . ':(exclude)control'
            if ! git diff --cached --quiet; then
              git commit -m "[${TASK_ID}] Preserve worker recovery checkpoint"
              recovery_commit=true
            fi
          fi

          git fetch origin "${BASE_BRANCH}"
          ahead="$(git rev-list --count "origin/${BASE_BRANCH}..HEAD")"
          if [[ "${ahead}" -eq 0 ]]; then
            echo "Worker produced no task commits beyond ${BASE_BRANCH}; nothing to publish."
            exit 0
          fi

          git push -u origin "HEAD:${preferred}"

          pr_number="$(gh pr list --repo "${GH_REPO}" --head "${preferred}" --base "${BASE_BRANCH}" --state open --limit 1 --json number --jq '.[0].number // empty')"
          if [[ -z "${pr_number}" ]]; then
            title="$(git log -1 --format=%s)"
            if [[ "${title}" != "[${TASK_ID}]"* ]]; then
              title="[${TASK_ID}] Autonomous implementation"
            fi
            body="Automated implementation for ${TASK_ID}.\n\nSource task: ${TASK_PATH}\n\nRemote publication is handled by the post-worker recovery step with a fresh GitHub App token."
            if [[ "${WORKER_OUTCOME}" == "success" && "${recovery_commit}" == "false" ]]; then
              gh pr create --repo "${GH_REPO}" --base "${BASE_BRANCH}" --head "${preferred}" --title "${title}" --body "${body}"
            else
              gh pr create --draft --repo "${GH_REPO}" --base "${BASE_BRANCH}" --head "${preferred}" --title "${title}" --body "${body}"
            fi
            pr_number="$(gh pr list --repo "${GH_REPO}" --head "${preferred}" --base "${BASE_BRANCH}" --state open --limit 1 --json number --jq '.[0].number // empty')"
          fi

          if [[ -z "${pr_number}" ]]; then
            echo "Unable to resolve a PR for ${TASK_ID} on ${preferred}." >&2
            exit 1
          fi

          if [[ "${WORKER_OUTCOME}" == "success" && "${recovery_commit}" == "false" ]]; then
            if [[ "$(gh pr view "${pr_number}" --repo "${GH_REPO}" --json isDraft --jq '.isDraft')" == 'true' ]]; then
              gh pr ready "${pr_number}" --repo "${GH_REPO}"
            fi
            echo "Published successful worker output to PR #${pr_number}."
          else
            echo "Preserved worker progress on PR #${pr_number}; run outcome=${WORKER_OUTCOME}, recovery_commit=${recovery_commit}. PR is not promoted by recovery."
          fi
